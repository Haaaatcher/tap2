[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tap2"
version = "0.1.1"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    {name = "Hang Luo", email = "haaaatcher@gmail.com"},
    {name = "Shan Li"},
    {name = "Qi-yang Lv"},
    {name = "Lu-yue Qiu"},
    {name = "Rui-hao He"},
    {name = "Bo-han Zhang"},
    {name = "Cheng-wei Li"}
]
urls = {Homepage = "https://github.com/Haaaatcher"}
description = "Use tap2 for property prediction of titanium alloy and aluminum alloy."
requires-python = ">=3.10"
keywords = ["titanium alloy", "aluminum alloy", "property prediction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.10.0",
    "gradio>=6.9.0",
    "litserve>=0.2.17",
    "click>=8.2.1",
    "art>=6.5",
    "numpy>=2.2.6",
    "pydantic>=2.12.5",
    "sparsemax>=0.1.9",
    "loguru>=0.7.3",
    "charset_normalizer>=3.4.3",
    "joblib>=1.5.3",
    "scipy>=1.15.3",
    "catboost>=1.2.10",
    "rich>=14.3.3",
    "ncn>=0.0.5",
    "lightgbm>=4.6.0",
    "scikit-learn==1.7.0",
    "xgboost==3.0.2"
]

[project.scripts]
tapp = "tap2.client:run_gradio_client"
tapp-client = "tap2.client:run_gradio_client"
tapp-server = "tap2.server:run_lit_server"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tap2 = [
    "weight/*",
    "resource/*",
    "checkpoints/*"
]
strengthml = [
    "*.pkl",
    "*.joblib"
]

[tool.setuptools.packages]
find = {}