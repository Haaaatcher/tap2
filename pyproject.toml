[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tapp"
version = "0.0.3"
authors = [
    {name = "Hang Luo", email = "haaaatcher@gmail.com"},
    {name = "Shan Li"},
    {name = "Qiyang Lv"},
    {name = "Luyue Qiu"}
]
description = "Use TAPP for property prediction of titanium alloy."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8.0",
    "gradio>=5.44.1",
    "art>=6.5",
    "tqdm>=4.67.1",
    "openpyxl>=3.1.5",
    "numpy>=2.2.6"
]

[project.scripts]
tapp = "tapp.ui:run_gradio"
tap2 = "tapp.ui:run_gradio"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tapp = [
    "weight/*",
    "normalization/*",
    "resource/*",
    "dataset/*"
]

[tool.setuptools.packages]
find = {}