[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tapp"
version = "0.0.6"
authors = [
    {name = "Hang Luo", email = "haaaatcher@gmail.com"},
    {name = "Shan Li"},
    {name = "Qiyang Lv"},
    {name = "Luyue Qiu"}
]
description = "Use TAPP for property prediction of titanium alloy."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8.0",
    "gradio>=5.49.1",
    "fastapi>=0.119.0",
    "uvicorn[standard]>=0.35.0",
    "click>=8.2.1",
    "art>=6.5",
    "tqdm>=4.67.1",
    "openpyxl>=3.1.5",
    "numpy>=2.2.6",
    "pydantic>=2.11.7"
]

[project.scripts]
tapu = "tapp.ui:run_gradio"
taps = "tapp.api:run_fast_api"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tapp = [
    "weight/*",
    "resource/*"
]

[tool.setuptools.packages]
find = {}